name: Corporate Identity & Tax Audit Pipeline

on: [push]

jobs:
  audit-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate t661_part7.xml dynamically
        run: |
          # Replace this with your actual generation script or command
          python generate_xml.py

      - name: Run Tax Audit Pipeline
        run: python parse_t661.py
