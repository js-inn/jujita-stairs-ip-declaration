name: Corporate Identity & Tax Audit Integrity CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pydantic

    - name: Initialize Taxonomy & Audit Database
      run: |
        python update_taxonomy.py
        python audit_logger.py
        python log_payload_hash.py

    - name: Execute Cryptographic Integrity Verification
      run: |
        python verify_integrity.py

    - name: Export Audit Manifests
      run: |
        python export_audit_package.py

    - name: Upload Audit Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: audit-manifests-${{ github.sha }}
        path: |
          audit_export_*.csv
          audit_export_*.json
